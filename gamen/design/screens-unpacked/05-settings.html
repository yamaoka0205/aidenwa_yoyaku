<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
</style>
</helmet>
<div style="position:relative;min-height:1500px;box-sizing:border-box;background:#F7F7F5;font-family:'Noto Sans JP',system-ui,sans-serif;color:#1C1917;font-variant-numeric:tabular-nums;padding-bottom:88px">

  <header style="background:#fff;border-bottom:1px solid #E7E5E4;position:sticky;top:0;z-index:5">
    <div style="max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px">
      <h1 style="margin:0;font-size:20px;font-weight:700;flex:1">お店の設定</h1>
      <button type="button" sc-camel-on-click="{{save}}" style="height:48px;padding:0 20px;border:0;border-radius:10px;background:#2563EB;color:#fff;font-size:15px;font-weight:700;cursor:pointer">保存する</button>
    </div>
  </header>

  <div style="max-width:680px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px">

    <!-- 1 基本 -->
    <section style="background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.08);padding:16px;display:flex;flex-direction:column;gap:16px">
      <h2 style="margin:0;font-size:17px;font-weight:700">1  基本</h2>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="shop" style="font-size:13px;font-weight:600;color:#44403C">店名</label>
        <input id="shop" type="text" value="食堂さくら" style="height:52px;border:1px solid #A8A29E;border-radius:10px;padding:0 14px;font-size:16px;background:#fff;box-sizing:border-box;width:100%">
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <span style="font-size:13px;font-weight:600;color:#44403C">標準の利用時間</span>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{stays}}" as="s" hint-placeholder-count="5">
            <button type="button" aria-pressed="{{s.sel}}" sc-camel-on-click="{{s.pick}}" style="min-width:64px;height:48px;padding:0 14px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;{{s.css}}">{{s.label}}</button>
          </sc-for>
        </div>
      </div>
    </section>

    <!-- 2 営業時間 -->
    <section style="background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.08);padding:16px;display:flex;flex-direction:column;gap:4px">
      <h2 style="margin:0 0 8px;font-size:17px;font-weight:700">2  営業時間</h2>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div style="display:flex;align-items:center;gap:10px;min-height:56px;border-top:1px solid #E7E5E4">
          <span style="width:24px;font-size:16px;font-weight:700">{{d.name}}</span>
          <button type="button" role="switch" aria-checked="{{d.on}}" aria-label="{{d.name}}曜日 営業" sc-camel-on-click="{{d.toggle}}" style="width:84px;height:44px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;{{d.swCss}}">{{d.swLabel}}</button>
          <div style="flex:1;display:flex;align-items:center;justify-content:flex-end;gap:6px;{{d.timeCss}}">
            <span style="min-width:64px;height:44px;border:1px solid #A8A29E;border-radius:10px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;background:#fff">{{d.from}}</span>
            <span style="font-size:14px;color:#57534E">〜</span>
            <span style="min-width:64px;height:44px;border:1px solid #A8A29E;border-radius:10px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;background:#fff">{{d.to}}</span>
          </div>
        </div>
      </sc-for>
    </section>

    <!-- 3 席 -->
    <section style="background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.08);padding:16px;display:flex;flex-direction:column;gap:4px">
      <h2 style="margin:0;font-size:17px;font-weight:700">3  席（AIが受ける枠）</h2>
      <p style="margin:0 0 8px;font-size:13px;line-height:1.7;color:#57534E">いまは表示だけです。変更は、今後できるようになります。</p>
      <sc-for list="{{seats}}" as="t" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid #E7E5E4">
          <span style="width:56px;font-size:16px;font-weight:700">{{t.name}}</span>
          <span style="flex:1;font-size:14px;color:#44403C">{{t.cap}}</span>
          <span style="font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;{{t.css}}">{{t.badge}}</span>
        </div>
      </sc-for>
    </section>

    <!-- 4 FAQ -->
    <section style="background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.08);padding:16px;display:flex;flex-direction:column;gap:4px">
      <h2 style="margin:0;font-size:17px;font-weight:700">4  よくある質問</h2>
      <p style="margin:0 0 8px;font-size:13px;line-height:1.7;color:#57534E">電話のAIが、お客様にこのとおりに答えます。</p>
      <sc-for list="{{faqs}}" as="f" hint-placeholder-count="2">
        <div style="display:flex;align-items:flex-start;gap:8px;padding:12px 0;border-top:1px solid #E7E5E4">
          <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700;line-height:1.5">{{f.q}}</div><div style="margin-top:2px;font-size:14px;line-height:1.7;color:#44403C">{{f.a}}</div></div>
          <button type="button" aria-label="この質問を削除" style="width:44px;height:44px;flex:none;border:0;border-radius:10px;background:transparent;color:#57534E;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
        </div>
      </sc-for>
      <button type="button" style="margin-top:8px;height:52px;border:1px dashed #2563EB;border-radius:10px;background:#EFF6FF;color:#1D4ED8;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer"><svg aria-hidden="true" width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>質問を追加する</button>
    </section>
  </div>

  <sc-if value="{{saved}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position:absolute;left:16px;right:16px;bottom:24px;max-width:648px;margin:0 auto;background:#15803D;color:#fff;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.16);z-index:6">
      <svg aria-hidden="true" width="26" height="26" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="12" cy="12" r="10"></circle><path d="m7.5 12.5 3 3 6-7"></path></svg>
      <div style="font-size:16px;font-weight:700">保存しました</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1500}}">
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const stay = st.stay || 90;
    const off = st.off || { 2: true };
    const sel = 'background:#2563EB;color:#fff;border:1px solid #2563EB;';
    const nor = 'background:#fff;color:#1C1917;border:1px solid #D6D3D1;';
    const stays = [60, 90, 120, 150, 180].map((m) => ({
      label: m + '分', sel: m === stay, css: m === stay ? sel : nor,
      pick: () => this.setState({ stay: m, saved: false })
    }));
    const names = ['月', '火', '水', '木', '金', '土', '日'];
    const days = names.map((n, i) => {
      const on = !off[i];
      return {
        name: n, on: on,
        swLabel: on ? '営業' : '休み',
        swCss: on ? 'background:#15803D;color:#fff;border:1px solid #15803D;' : 'background:#E7E5E4;color:#44403C;border:1px solid #A8A29E;',
        timeCss: on ? '' : 'opacity:.35;pointer-events:none;',
        from: '17:00', to: i >= 4 && i <= 5 ? '24:00' : '23:00',
        toggle: () => { const o = Object.assign({}, off); if (o[i]) delete o[i]; else o[i] = true; this.setState({ off: o, saved: false }); }
      };
    });
    const ok = 'background:#EFF6FF;color:#1D4ED8;';
    const walk = 'background:#F5F5F4;color:#44403C;';
    const seats = [
      { name: 'T1', cap: '2名席', badge: 'AI予約OK', css: ok },
      { name: 'T2', cap: '2名席', badge: 'AI予約OK', css: ok },
      { name: 'T3', cap: '4名席', badge: 'AI予約OK', css: ok },
      { name: 'カウンター', cap: '1名席 × 5', badge: '当日のお客様用', css: walk }
    ];
    const faqs = [
      { q: '予約の変更はできますか？', a: 'お電話でお受けします。前日までにご連絡ください。' },
      { q: '子ども連れでも大丈夫ですか？', a: 'はい、大丈夫です。ご予約の際にお知らせください。' }
    ];
    return {
      stays: stays, days: days, seats: seats, faqs: faqs, saved: !!st.saved,
      save: () => this.setState({ saved: true })
    };
  }
}
</script>
